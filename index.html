<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PaCo Poster</title>

  <style>
    :root{
      /* NUR HELLER & FREUNDLICHER – sonst identisch */
      --bg0:#0B1030;
      --bg1:#142A4A;
      --bg2:#0D2238;

      --glass:rgba(255,255,255,.07);
      --border:rgba(255,255,255,.14);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --shadow:0 28px 80px rgba(0,0,0,.55);
      --radius:18px;
      --max:1200px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;

      /* exakt gleiches Design, nur hellere Basis */
      background:
        radial-gradient(900px 520px at 15% 8%, rgba(140,190,255,.32), transparent 55%),
        radial-gradient(700px 520px at 85% 18%, rgba(90,240,255,.22), transparent 55%),
        radial-gradient(760px 600px at 60% 90%, rgba(180,150,255,.16), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 40%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg2));
    }

    body::before{
      content:"";
      position:fixed;
      inset:-2px;
      pointer-events:none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size:120px 120px;
      opacity:.12;
      filter:blur(.2px);
      mask-image:radial-gradient(1200px 700px at 50% 20%, #000 35%, transparent 70%);
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      padding:16px 0;
      backdrop-filter:blur(12px);
      background:linear-gradient(180deg, rgba(11,16,48,.78), rgba(11,16,48,.32));
      border-bottom:1px solid rgba(255,255,255,.10);
    }

    /* REST KOMPLETT UNVERÄNDERT */
  </style>
</head>


  <script>
    /*
      WICHTIG:
      - Hier nur PNG-Links (AWS) eintragen.
      - KEIN pdf-Feld mehr nötig.
      - thumb = direkte URL zur PNG.
    */

    const posters = {
      de: [
        { title: "Gewaltfreiheit", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/1_Gewaltfreiheit.png" },
        { title: "Aufsichtspflicht", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/2_Aufsichtspflicht.png" },
        { title: "Mediennutzung", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/3_Mediennutzung.png" },
        { title: "Tagesablauf", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/4_Tagesablauf.png" },
        { title: "Sprachentwicklung", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/5_Sprachentwicklung.png" },
        { title: "Kinderuntersuchungsheft", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/6_Kinderuntersuchungsheft.png" },
        { title: "Traumafolgestörung", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/7_Traumafolgesto%CC%88rungen.png" },
        { title: "Umgang mit Stress bei Kindern", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/8_Umgang+mit+Stress.png" },
      ],
      en: [
        { title: "Non-Violence", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/1_non-violence.png" },
        { title: "Duty of Supervision", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/2_duty+of+supervision.png" },
        { title: "Media Usage", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/3_media+usage.png" },
        { title: "Daily Routine", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/5_language+development.png" },
        { title: "Language Development", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/5_language+development.png" },
        { title: "Child Health Record", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/6_child+health+record.png" },
        { title: "Trauma-Related Disorders", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/7_trauma+related+disorders.png" },
        { title: "Coping with Stress in Children", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/8_coping+with+stress.png" },
      ]
    };

    const i18n = {
      de: {
        htmlLang: "de",
        headline: "Parents' College Poster",
        subline: "Klicken Sie auf ein Poster zum Vergrößern.",
        close: "Schließen",
        hint: "PNG"
      },
      en: {
        htmlLang: "en",
        headline: "Parents' College Poster",
        subline: "Click a poster to enlarge it.",
        close: "Close",
        hint: "PNG"
      }
    };

    const grid = document.getElementById("grid");
    const btnDE = document.getElementById("btnDE");
    const btnEN = document.getElementById("btnEN");
    const headline = document.getElementById("headline");
    const subline = document.getElementById("subline");

    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");
    const lbClose = document.getElementById("lbClose");

    function setActiveLang(lang){
      btnDE.classList.toggle("active", lang === "de");
      btnEN.classList.toggle("active", lang === "en");
    }

    function openLightbox(p, lang){
      const t = i18n[lang];
      lbImg.src = p.thumb;
      lbImg.alt = p.title;
      lbTitle.textContent = p.title;
      lbClose.textContent = t.close;
      lightbox.showModal();
    }

    function render(lang){
      const t = i18n[lang];
      document.documentElement.lang = t.htmlLang;
      headline.textContent = t.headline;
      subline.textContent = t.subline;
      setActiveLang(lang);

      localStorage.setItem("lang", lang);
      const url = new URL(window.location.href);
      url.searchParams.set("lang", lang);
      history.replaceState({}, "", url);

      grid.innerHTML = "";
      posters[lang].forEach((p) => {
        const tile = document.createElement("article");
        tile.className = "tile";
        tile.tabIndex = 0;

        tile.innerHTML = `
          <img class="thumb" src="${p.thumb}" alt="${p.title}" loading="lazy">
          <div class="meta">
            <p class="title">${p.title}</p>
            <p class="hint">${t.hint}</p>
          </div>
        `;

        const handler = () => openLightbox(p, lang);
        tile.addEventListener("click", handler);
        tile.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handler(); }
        });

        grid.appendChild(tile);
      });
    }

    function initialLang(){
      const url = new URL(window.location.href);
      const q = url.searchParams.get("lang");
      if (q === "de" || q === "en") return q;
      const saved = localStorage.getItem("lang");
      if (saved === "de" || saved === "en") return saved;
      return "de";
    }

    btnDE.addEventListener("click", () => render("de"));
    btnEN.addEventListener("click", () => render("en"));

    lbClose.addEventListener("click", () => lightbox.close());
    lightbox.addEventListener("click", (e) => {
      const card = document.querySelector(".lb");
      const rect = card.getBoundingClientRect();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (!inside) lightbox.close();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && lightbox.open) lightbox.close();
    });

    render(initialLang());
  </script>
</body>
</html>
