<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PaCo Poster</title>

  <style>
    :root{
      /* Cleaner, heller, bluish – aber nicht nur blau */
      --bg0:#060816;
      --bg1:#0A1030;
      --bg2:#07121F;
      --glass:rgba(255,255,255,.07);
      --border:rgba(255,255,255,.14);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --shadow:0 28px 80px rgba(0,0,0,.55);
      --radius:18px;
      --max:1200px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;

      /* “fancy” Elemente: hellere Glows + softes Gradient */
      background:
        radial-gradient(900px 520px at 15% 8%, rgba(120,170,255,.28), transparent 55%),
        radial-gradient(700px 520px at 85% 18%, rgba(60,230,255,.18), transparent 55%),
        radial-gradient(760px 600px at 60% 90%, rgba(160,120,255,.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg2));
    }

    /* dezente “Lines” als Texture */
    body::before{
      content:"";
      position:fixed;
      inset:-2px;
      pointer-events:none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 120px 120px;
      opacity:.12;
      filter: blur(.2px);
      mask-image: radial-gradient(1200px 700px at 50% 20%, #000 35%, transparent 70%);
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      padding:16px 0;
      backdrop-filter: blur(12px);
      background: linear-gradient(180deg, rgba(6,8,22,.85), rgba(6,8,22,.35));
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .wrap{ max-width:var(--max); margin:0 auto; padding:0 18px 40px; }

    .lang{
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .pill{
      display:inline-flex;
      gap:6px;
      padding:6px;
      border-radius:999px;
      background:var(--glass);
      border:1px solid var(--border);
      box-shadow:0 10px 30px rgba(0,0,0,.28);
    }
    .pill button{
      border:0;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      font-weight:650;
      padding:10px 16px;
      border-radius:999px;
      transition:all .2s ease;
    }
    .pill button.active{
      color:var(--text);
      background: linear-gradient(135deg, rgba(120,170,255,.45), rgba(60,230,255,.22));
      border:1px solid rgba(255,255,255,.14);
    }

    header{
      text-align:center;
      padding:32px 0 18px;
    }
    h1{
      margin:0 0 8px;
      font-size:clamp(22px, 2.8vw, 34px);
      font-weight:800;
      letter-spacing:-.6px;
    }
    p.sub{
      margin:0;
      color:var(--muted);
      font-size:14.5px;
    }

    /* Grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:18px;
      margin-top:18px;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: 1fr; }
    }

    .tile{
      position:relative;
      border-radius: var(--radius);
      overflow:hidden;
      background: linear-gradient(180deg, var(--glass), rgba(255,255,255,.02));
      border:1px solid var(--border);
      box-shadow: var(--shadow);
      cursor:pointer;
      transform: translateZ(0);
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .tile:hover{
      transform: translateY(-5px);
      box-shadow: 0 36px 95px rgba(0,0,0,.62);
    }

    .thumb{
      width:100%;
      aspect-ratio: 210 / 297;
      object-fit: cover;
      display:block;
      background: rgba(255,255,255,.04);
      transition: transform .32s ease;
    }
    .tile:hover .thumb{ transform: scale(1.02); }

    .meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:12px 12px 14px;
      border-top:1px solid rgba(255,255,255,.10);
    }
    .title{
      margin:0;
      font-size:13.5px;
      font-weight:700;
      color: rgba(255,255,255,.86);
    }
    .hint{
      margin:0;
      font-size:12px;
      color: var(--muted);
      white-space:nowrap;
    }

    /* Lightbox */
    dialog#lightbox{
      border:none;
      padding:0;
      width:100vw;
      height:100vh;
      background: rgba(0,0,0,.68);
      backdrop-filter: blur(12px);
    }
    dialog::backdrop{ background: rgba(0,0,0,.68); }

    .lb{
      width:min(980px, 92vw);
      margin:auto;
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(12,16,34,.62);
      box-shadow: 0 30px 90px rgba(0,0,0,.65);
    }
    .lb img{
      width:100%;
      max-height: 78vh;
      object-fit: contain;
      background: rgba(255,255,255,.04);
      display:block;
    }
    .lbbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border-top:1px solid rgba(255,255,255,.10);
    }
    .lbtitle{ margin:0; font-size:13.5px; color: rgba(255,255,255,.86); }
    .actions{ display:flex; gap:10px; align-items:center; }
    .btn{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.90);
      padding:8px 12px;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
      text-decoration:none;
      font-size:13px;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="lang">
        <div class="pill">
          <button id="btnDE" class="active" type="button">Deutsch</button>
          <button id="btnEN" type="button">English</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <header>
      <h1 id="headline">Parents' College Poster</h1>
      <p class="sub" id="subline">Klicken Sie auf ein Poster zum Vergrößern.</p>
    </header>

    <main class="grid" id="grid" aria-label="Poster grid"></main>
  </div>

  <dialog id="lightbox" aria-label="Poster viewer">
    <div class="lb" role="document">
      <img id="lbImg" alt="" />
      <div class="lbbar">
        <p class="lbtitle" id="lbTitle"></p>
        <div class="actions">
          <button class="btn" id="lbClose" type="button">Schließen</button>
        </div>
      </div>
    </div>
  </dialog>

  <script>
    /*
      WICHTIG:
      - Hier nur PNG-Links (AWS) eintragen.
      - KEIN pdf-Feld mehr nötig.
      - thumb = direkte URL zur PNG.
    */

    const posters = {
      de: [
        { title: "Gewaltfreiheit", thumb: "https://baseresourcesstack-documentsbucket9ec9deb9-qmmkdw8bfxhu.s3.eu-central-1.amazonaws.com/public/videos/Website/Poster/1.png" },
        { title: "Aufsichtspflicht", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Mediennutzung", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Tagesablauf", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Sprachentwicklung", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Kinderuntersuchungsheft", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Traumafolgestörung", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Umgang mit Stress bei Kindern", thumb: "PASTE_AWS_PNG_URL_HERE" },
      ],
      en: [
        { title: "Non-Violence", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Duty of Supervision", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Media Usage", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Daily Routine", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Language Development", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Child Health Record", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Trauma-Related Disorders", thumb: "PASTE_AWS_PNG_URL_HERE" },
        { title: "Coping with Stress in Children", thumb: "PASTE_AWS_PNG_URL_HERE" },
      ]
    };

    const i18n = {
      de: {
        htmlLang: "de",
        headline: "Parents' College Poster",
        subline: "Klicken Sie auf ein Poster zum Vergrößern.",
        close: "Schließen",
        hint: "PNG"
      },
      en: {
        htmlLang: "en",
        headline: "Parents' College Poster",
        subline: "Click a poster to enlarge it.",
        close: "Close",
        hint: "PNG"
      }
    };

    const grid = document.getElementById("grid");
    const btnDE = document.getElementById("btnDE");
    const btnEN = document.getElementById("btnEN");
    const headline = document.getElementById("headline");
    const subline = document.getElementById("subline");

    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");
    const lbClose = document.getElementById("lbClose");

    function setActiveLang(lang){
      btnDE.classList.toggle("active", lang === "de");
      btnEN.classList.toggle("active", lang === "en");
    }

    function openLightbox(p, lang){
      const t = i18n[lang];
      lbImg.src = p.thumb;
      lbImg.alt = p.title;
      lbTitle.textContent = p.title;
      lbClose.textContent = t.close;
      lightbox.showModal();
    }

    function render(lang){
      const t = i18n[lang];
      document.documentElement.lang = t.htmlLang;
      headline.textContent = t.headline;
      subline.textContent = t.subline;
      setActiveLang(lang);

      localStorage.setItem("lang", lang);
      const url = new URL(window.location.href);
      url.searchParams.set("lang", lang);
      history.replaceState({}, "", url);

      grid.innerHTML = "";
      posters[lang].forEach((p) => {
        const tile = document.createElement("article");
        tile.className = "tile";
        tile.tabIndex = 0;

        tile.innerHTML = `
          <img class="thumb" src="${p.thumb}" alt="${p.title}" loading="lazy">
          <div class="meta">
            <p class="title">${p.title}</p>
            <p class="hint">${t.hint}</p>
          </div>
        `;

        const handler = () => openLightbox(p, lang);
        tile.addEventListener("click", handler);
        tile.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handler(); }
        });

        grid.appendChild(tile);
      });
    }

    function initialLang(){
      const url = new URL(window.location.href);
      const q = url.searchParams.get("lang");
      if (q === "de" || q === "en") return q;
      const saved = localStorage.getItem("lang");
      if (saved === "de" || saved === "en") return saved;
      return "de";
    }

    btnDE.addEventListener("click", () => render("de"));
    btnEN.addEventListener("click", () => render("en"));

    lbClose.addEventListener("click", () => lightbox.close());
    lightbox.addEventListener("click", (e) => {
      const card = document.querySelector(".lb");
      const rect = card.getBoundingClientRect();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (!inside) lightbox.close();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && lightbox.open) lightbox.close();
    });

    render(initialLang());
  </script>
</body>
</html>
